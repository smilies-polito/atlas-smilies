# ATLAS platform support record
#
# This file is the single statement of which platforms and Python versions ATLAS
# supports. The README, the classifiers in pyproject.toml, and the verification job
# in .github/workflows/platforms.yaml all read from it.
#
# It is a record of expectations, not a wish list. `scripts/check_platform_support.py`
# resolves every entry below and fails when reality differs from what is recorded —
# in either direction. An entry expected to fail that starts succeeding is a defect in
# this file, not an improvement to be absorbed silently.
#
# Outcome vocabulary (three values, deliberately not a boolean):
#
#   wheel-complete    a solution exists and installs from wheels alone
#   requires-build    a solution exists, but installing it compiles a package
#                     from source, so a build toolchain is needed
#   does-not-resolve  no consistent version set exists for this combination
#
# Verification depth, recorded per platform, and never overstated in documentation:
#
#   resolution          only resolved and wheel-checked; no machine has run it
#   install-and-import  installed and imported on a runner of this platform
#   tested              the test suite runs on this platform
#   unverified          not yet executed anywhere; do not claim support
#
# A depth is promoted only by an observed run. Until the jobs in platforms.yaml have
# reported, every platform but Linux x86_64 stays `unverified`, however confidently
# its resolution succeeds — resolving is not running.

schema-version = 1

# Source distributions with no wheels on any platform at any version, which are
# nevertheless pure Python and build anywhere without a compiler. The wheel check
# permits exactly these and no others: a new sdist-only dependency must be added
# here deliberately, after someone confirms it needs no build toolchain.
pure-python-sdists = [ "docrep", "loompy" ]

# The dependency set has two worlds, separated by cellrank 2.1.0's `requires-python
# >=3.12`. Which world an installation lands in is decided by the user's interpreter,
# because pip resolves against the running Python alone.
[dependency-worlds.older]
pythons = [ "3.11" ]
cellrank = "2.0.7"
jax = "0.10.2"
scanpy = "1.11.5"
numpy = "2.4.6"
anndata = "0.12.19"

[dependency-worlds.current]
pythons = [ "3.12", "3.13", "3.14" ]
cellrank = "2.3.2"
jax = "0.11.1"
scanpy = "1.12.3"
numpy = "2.5.2"
anndata = "0.13.2"

# macOS x86_64 belongs to whichever world its Python selects, except for jax: no
# jaxlib newer than 0.4.38 ships a macOS x86_64 wheel, so every resolution there pins
# a December 2024 JAX. On 3.12 and 3.13 that is paired with cellrank 2.3.2 and numpy
# 2.5.2 — a combination that exists on no other platform.
[dependency-worlds.macos-x86_64-exception]
jax = "0.4.38"
pythons = [ "3.11", "3.12", "3.13" ]

[[platform]]
tag = "x86_64-unknown-linux-gnu"
name = "Linux x86_64"
runner = "ubuntu-latest"
verified = "tested"
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "wheel-complete" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "wheel-complete" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "wheel-complete" },
  { python = "3.14", shape = "core", expected = "wheel-complete" },
  { python = "3.14", shape = "trees", expected = "wheel-complete" },
]

[[platform]]
tag = "aarch64-unknown-linux-gnu"
name = "Linux aarch64"
runner = "ubuntu-24.04-arm"
verified = "unverified"
# The core install is wheel-clean here. The `trees` extra is not: scikit-misc
# publishes manylinux x86_64, both macOS arches and win_amd64, but no aarch64 wheel
# at any version ATLAS can use. This is the cost the extra was accepted for.
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "requires-build", blame = "scikit-misc" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "requires-build", blame = "scikit-misc" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "requires-build", blame = "scikit-misc" },
  { python = "3.14", shape = "core", expected = "wheel-complete" },
  { python = "3.14", shape = "trees", expected = "requires-build", blame = "scikit-misc" },
]

[[platform]]
tag = "aarch64-apple-darwin"
name = "macOS arm64"
runner = "macos-latest"
verified = "unverified"
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "wheel-complete" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "wheel-complete" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "wheel-complete" },
  { python = "3.14", shape = "core", expected = "wheel-complete" },
  { python = "3.14", shape = "trees", expected = "wheel-complete" },
]

[[platform]]
tag = "x86_64-apple-darwin"
name = "macOS x86_64"
runner = "macos-15-intel"
# Resolution says 3.11 through 3.13 install from wheels here. Nothing has ever
# imported the result, and what it resolves to is unusual enough that resolution is
# not evidence it runs: see dependency-worlds.macos-x86_64-exception. Until the
# smoke job reports, this platform is claimed nowhere.
verified = "unverified"
# 3.14 fails because no jaxlib new enough for cp314 ships a macOS x86_64 wheel, and
# the chain that requires it is palantir -> mellon -> jaxopt -> jaxlib. This is the
# documented limitation working as intended; it is recorded, not omitted, so that it
# is re-examined when jaxlib changes.
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "wheel-complete" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "wheel-complete" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "wheel-complete" },
  { python = "3.14", shape = "core", expected = "does-not-resolve", blame = "jaxlib" },
  { python = "3.14", shape = "trees", expected = "does-not-resolve", blame = "jaxlib" },
]

[[platform]]
tag = "x86_64-pc-windows-msvc"
name = "Windows x86_64"
runner = "windows-latest"
verified = "unverified"
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "wheel-complete" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "wheel-complete" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "wheel-complete" },
  { python = "3.14", shape = "core", expected = "wheel-complete" },
  { python = "3.14", shape = "trees", expected = "wheel-complete" },
]
