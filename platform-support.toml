# ATLAS platform support record
#
# This file is the single statement of which platforms and Python versions ATLAS
# supports. The README, the classifiers in pyproject.toml, and the verification job
# in .github/workflows/platforms.yaml all read from it.
#
# It is a record of expectations. `scripts/check_platform_support.py`
# resolves every entry below and fails when reality differs from what is recorded —
# in either direction.
#
# Outcome vocabulary (three values, deliberately not a boolean):
#
#   wheel-complete    a wheel-only solution EXISTS for this combination
#   requires-build    a solution exists, but installing it compiles a package
#                     from source, so a build toolchain is needed
#   does-not-resolve  no consistent version set exists for this combination
#
# `wheel-complete` says a wheel-only solution exists. It does NOT say that `pip
# install` finds it. pip accepts a source distribution as a valid candidate and
# backtracks only on constraint conflicts, never on a missing wheel — so it can
# settle on an sdist and discover at build time that it cannot be built, while a
# wheel-only solution sat one version lower the whole time. What a user actually
# gets is recorded separately, in the [[smoke]] table below.
#
# Verification depth, recorded per platform, and never overstated in documentation:
#
#   resolution          only resolved and wheel-checked; no machine has run it
#   install-and-import  installed and imported on a runner of this platform
#   tested              the test suite runs on this platform
#   install-fails       an installation was attempted here and does not succeed
#   unverified          not yet executed anywhere; do not claim support
#
# A depth is promoted only by an observed run — resolving is not running.
#
# Each [[smoke]] entry carries two more fields, kept separate because they answer
# different questions:
#
#   route        where the dependencies come from
#                  pip         everything from PyPI
#                  conda-base  numba, llvmlite, jax and jaxlib from conda-forge,
#                              then pip for ATLAS and everything else
#
#   environment  what the install is performed into
#                  venv        python -m venv
#                  conda       a conda environment holding only the interpreter,
#                              unless the route says otherwise
#

schema-version = 1

pure-python-sdists = [ "docrep", "loompy" ]

[dependency-worlds.older]
pythons = [ "3.11" ]
cellrank = "2.0.7"
jax = "0.10.2"
scanpy = "1.11.5"
numpy = "2.4.6"
anndata = "0.12.19"

[dependency-worlds.current]
pythons = [ "3.12", "3.13", "3.14" ]
cellrank = "2.3.2"
jax = "0.11.1"
scanpy = "1.12.3"
numpy = "2.5.2"
anndata = "0.13.2"

[dependency-worlds.macos-x86_64-exception]
jax = "0.4.38"
pythons = [ "3.11", "3.12", "3.13" ]

[[platform]]
tag = "x86_64-unknown-linux-gnu"
name = "Linux x86_64"
runner = "ubuntu-latest"
verified = "tested"
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "wheel-complete" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "wheel-complete" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "wheel-complete" },
  { python = "3.14", shape = "core", expected = "wheel-complete" },
  { python = "3.14", shape = "trees", expected = "wheel-complete" },
]

[[platform]]
tag = "aarch64-unknown-linux-gnu"
name = "Linux aarch64"
runner = "ubuntu-24.04-arm"
verified = "install-and-import"
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "requires-build", blame = "scikit-misc" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "requires-build", blame = "scikit-misc" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "requires-build", blame = "scikit-misc" },
  { python = "3.14", shape = "core", expected = "wheel-complete" },
  { python = "3.14", shape = "trees", expected = "requires-build", blame = "scikit-misc" },
]

[[platform]]
tag = "aarch64-apple-darwin"
name = "macOS arm64"
runner = "macos-latest"
verified = "tested"
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "wheel-complete" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "wheel-complete" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "wheel-complete" },
  { python = "3.14", shape = "core", expected = "wheel-complete" },
  { python = "3.14", shape = "trees", expected = "wheel-complete" },
]

[[platform]]
tag = "x86_64-apple-darwin"
name = "macOS x86_64"
runner = "macos-15-intel"
verified = "tested"
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "wheel-complete" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "wheel-complete" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "wheel-complete" },
  { python = "3.14", shape = "core", expected = "does-not-resolve", blame = "jaxlib" },
  { python = "3.14", shape = "trees", expected = "does-not-resolve", blame = "jaxlib" },
]

[[platform]]
tag = "x86_64-pc-windows-msvc"
name = "Windows x86_64"
runner = "windows-latest"
verified = "tested"
entries = [
  { python = "3.11", shape = "core", expected = "wheel-complete" },
  { python = "3.11", shape = "trees", expected = "wheel-complete" },
  { python = "3.12", shape = "core", expected = "wheel-complete" },
  { python = "3.12", shape = "trees", expected = "wheel-complete" },
  { python = "3.13", shape = "core", expected = "wheel-complete" },
  { python = "3.13", shape = "trees", expected = "wheel-complete" },
  { python = "3.14", shape = "core", expected = "wheel-complete" },
  { python = "3.14", shape = "trees", expected = "wheel-complete" },
]

[[smoke]]
platform = "x86_64-unknown-linux-gnu"
route = "pip"
environment = "venv"
pythons = [ "3.11", "3.14" ]
shape = "trees"
expected = "succeeds"

[[smoke]]
platform = "aarch64-unknown-linux-gnu"
route = "pip"
environment = "venv"
pythons = [ "3.14" ]
shape = "core"
expected = "succeeds"

[[smoke]]
platform = "aarch64-apple-darwin"
route = "pip"
environment = "venv"
pythons = [ "3.11", "3.14" ]
shape = "trees"
expected = "succeeds"

[[smoke]]
platform = "x86_64-apple-darwin"
route = "pip"
environment = "venv"
pythons = [ "3.11", "3.13" ]
shape = "trees"
expected = "fails"
blame = "llvmlite"
reason = "pip selects numba 0.67.0 from source; its llvmlite 0.49.0 needs a prebuilt LLVM"

[[smoke]]
platform = "x86_64-pc-windows-msvc"
route = "pip"
environment = "venv"
pythons = [ "3.11", "3.14" ]
shape = "trees"
expected = "succeeds"

[[smoke]]
platform = "x86_64-unknown-linux-gnu"
route = "pip"
environment = "conda"
pythons = [ "3.11", "3.14" ]
shape = "trees"
expected = "succeeds"

[[smoke]]
platform = "aarch64-unknown-linux-gnu"
route = "pip"
environment = "conda"
pythons = [ "3.14" ]
shape = "core"
expected = "succeeds"

[[smoke]]
platform = "aarch64-apple-darwin"
route = "pip"
environment = "conda"
pythons = [ "3.11", "3.14" ]
shape = "trees"
expected = "succeeds"

[[smoke]]
platform = "x86_64-pc-windows-msvc"
route = "pip"
environment = "conda"
pythons = [ "3.11", "3.14" ]
shape = "trees"
expected = "succeeds"

[[smoke]]
platform = "x86_64-apple-darwin"
route = "pip"
environment = "conda"
pythons = [ "3.11", "3.14" ]
shape = "trees"
expected = "fails"
blame = "llvmlite"
reason = "the interpreter's provenance does not change pip's answer; the same sdist is selected and the same build fails"
# The evidence differs between these two Pythons, deliberately.
#
#   3.11  verified by running pip on a macos-15-intel runner. It has to be: pip
#         resolves there and fails at BUILD, and the resolution table records the
#         cell as `wheel-complete` because a wheel-only solution does exist. uv is
#         structurally blind to what pip actually selects, so nothing else can
#         establish this.
#
#   3.14  verified by uv's cross-resolve alone, which asserts `does-not-resolve`
#         for the cell. The pip run was removed: it reached the same verdict by
#         backtracking through every published jax, taking 34 minutes against the
#         resolution job's 21 seconds for the whole grid.
#
# The verdict is unchanged for both. The basis for 3.14 is weaker, and this note
# exists so that reads as a decision rather than as an oversight.

[[smoke]]
platform = "x86_64-apple-darwin"
route = "conda-base"
environment = "conda"
pythons = [ "3.11", "3.14" ]
shape = "trees"
expected = "succeeds"
conda-packages = [ "numba", "llvmlite", "jax", "jaxlib" ]
