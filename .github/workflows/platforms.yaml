name: Platforms

# Verifies the claims in platform-support.toml rather than asserting them.
#
# Three tiers, each answering a different question:
#   resolution  — does a solution exist, and does it install from wheels alone?
#                 Cross-resolved for all five platforms from one Linux runner.
#   smoke       — does the resolved set actually import on that machine?
#   test        — do paths, encoding and process spawning work on macOS and Windows?
#
# test.yaml is deliberately untouched: it is owned by the cookiecutter-scverse
# template that .cruft.json pins, and every local edit there conflicts on the next
# `cruft update`. The non-Linux test runs live here instead, as their own job.

on:
  push:
    branches: [public]
  pull_request:
    branches: [public]
  schedule:
    - cron: "0 5 1,15 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Does it resolve, and is it wheel-complete? ────────────────────────────────
  # One Linux runner covers every platform ATLAS claims. uv cross-resolves from the
  # platform tag, so no macOS or Windows machine is involved, and no package is
  # downloaded. The script asserts platform-support.toml entry by entry: it fails on
  # an unexpected failure and equally on an unexpected success.
  resolution:
    name: Resolution matrix (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check platform support record
        run: python scripts/check_platform_support.py

  # ── Does the resolved set import on the machine itself? ───────────────────────
  # Installs with pip, not uv: pip is what the README instructs and what decides the
  # versions a user actually receives. Each entry names the Python explicitly, since
  # which interpreter runs decides which dependency world is installed.
  #
  # `expect` mirrors the [[smoke]] table in platform-support.toml. A job whose install
  # is expected to fail asserts that failure rather than going red — and fails if the
  # install unexpectedly succeeds, so a limitation that has been lifted is reported
  # rather than absorbed.
  smoke:
    name: Install and import (${{ matrix.name }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the evidence from the others; the point
      # of the job is the whole picture, not the first red cell.
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest, python: "3.11", extras: "[trees]", expect: succeeds }
          - { name: Linux x86_64, os: ubuntu-latest, python: "3.14", extras: "[trees]", expect: succeeds }
          - { name: Linux aarch64, os: ubuntu-24.04-arm, python: "3.14", extras: "", expect: succeeds }
          - { name: macOS arm64, os: macos-latest, python: "3.11", extras: "[trees]", expect: succeeds }
          - { name: macOS arm64, os: macos-latest, python: "3.14", extras: "[trees]", expect: succeeds }
          - { name: macOS x86_64, os: macos-15-intel, python: "3.11", extras: "[trees]", expect: fails }
          - { name: macOS x86_64, os: macos-15-intel, python: "3.13", extras: "[trees]", expect: fails }
          - { name: Windows x86_64, os: windows-latest, python: "3.11", extras: "[trees]", expect: succeeds }
          - { name: Windows x86_64, os: windows-latest, python: "3.14", extras: "[trees]", expect: succeeds }
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install into a clean environment
        run: |
          python -m venv .smoke
          python -m pip install --upgrade pip
        shell: bash
      - name: pip install .${{ matrix.extras }}
        id: install
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then . .smoke/Scripts/activate; else . .smoke/bin/activate; fi
          python -m pip install ".${{ matrix.extras }}"
          python -m pip list
        shell: bash

      - name: Compare install outcome with the record
        run: |
          actual='${{ steps.install.outcome }}'   # success | failure
          case "${{ matrix.expect }}:$actual" in
            succeeds:success)
              echo "Installed, as the record expects." ;;
            fails:failure)
              echo "Install failed, as platform-support.toml records for this platform." ;;
            succeeds:failure)
              echo "::error::Install failed, but the record expects it to succeed. Either a dependency stopped publishing a wheel for this platform, or the record is wrong."
              exit 1 ;;
            fails:success)
              echo "::error::Install SUCCEEDED, but the record expects it to fail. The limitation has been lifted — update platform-support.toml and the README, which currently understate what works."
              exit 1 ;;
          esac
        shell: bash
      # Importing the top-level package alone would not notice a broken dependency
      # behind a submodule, so each subpackage is imported explicitly.
      - name: Import the package
        # Skipped where the install is expected to fail; there is nothing to import.
        if: matrix.expect == 'succeeds'
        env:
          MPLBACKEND: agg
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then . .smoke/Scripts/activate; else . .smoke/bin/activate; fi
          python -c "
          import atlas, atlas.pp, atlas.tl, atlas.pl
          print('atlas', getattr(atlas, '__version__', 'unknown'))
          "
        shell: bash

  # ── Does it work when conda provides the environment? ─────────────────────────
  # The same route as `smoke` — pip resolves everything from PyPI — performed inside
  # a clean conda environment rather than a venv. The installation instruction offers
  # both, so both are claimed on every supported platform and both are verified.
  #
  # These entries match their `smoke` counterparts exactly, so a difference between
  # the two jobs is attributable to the environment provider and to nothing else.
  # Intel macOS is absent here because the route job below covers the same
  # combination as its first step, asserting that it fails there.
  smoke-conda:
    name: Install and import, conda env (${{ matrix.name }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest, python: "3.11", extras: "[trees]", expect: succeeds }
          - { name: Linux x86_64, os: ubuntu-latest, python: "3.14", extras: "[trees]", expect: succeeds }
          - { name: Linux aarch64, os: ubuntu-24.04-arm, python: "3.14", extras: "", expect: succeeds }
          - { name: macOS arm64, os: macos-latest, python: "3.11", extras: "[trees]", expect: succeeds }
          - { name: macOS arm64, os: macos-latest, python: "3.14", extras: "[trees]", expect: succeeds }
          - { name: Windows x86_64, os: windows-latest, python: "3.11", extras: "[trees]", expect: succeeds }
          - { name: Windows x86_64, os: windows-latest, python: "3.14", extras: "[trees]", expect: succeeds }
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up micromamba with Python ${{ matrix.python }}
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: atlas
          create-args: python=${{ matrix.python }} pip
          init-shell: bash
          cache-environment: false
      - name: pip install .${{ matrix.extras }}
        id: install
        continue-on-error: true
        shell: bash -el {0}
        run: |
          micromamba list
          python -m pip install ".${{ matrix.extras }}"
          python -m pip list

      - name: Compare install outcome with the record
        shell: bash -el {0}
        run: |
          actual='${{ steps.install.outcome }}'
          case "${{ matrix.expect }}:$actual" in
            succeeds:success)
              echo "Installed in a conda environment, as the record expects." ;;
            fails:failure)
              echo "Install failed, as platform-support.toml records for this platform." ;;
            succeeds:failure)
              echo "::error::Install failed in a conda environment but succeeds in a venv, or the record is wrong. A difference here is attributable to the environment provider: compare against the matching smoke job."
              exit 1 ;;
            fails:success)
              echo "::error::Install SUCCEEDED, but the record expects it to fail. Update platform-support.toml and the README, which currently understate what works."
              exit 1 ;;
          esac

      - name: Import the package
        if: matrix.expect == 'succeeds'
        env:
          MPLBACKEND: agg
        shell: bash -el {0}
        run: |
          python -c "
          import atlas, atlas.pp, atlas.tl, atlas.pl
          print('atlas', getattr(atlas, '__version__', 'unknown'))
          "

  # ── Intel macOS: the documented exception ─────────────────────────────────────
  # The one platform where `pip install atlas-smilies` does not work, and the only
  # one for which the documentation names a second route. Both are asserted here:
  #
  #   step 1  conda env, pip only          → expected to FAIL
  #   step 2  conda env + conda base, pip  → expected to SUCCEED
  #
  # Step 1 is not a supported route; it is the assertion that catches the day pip
  # starts working here
  #
  # 3.11 and 3.14 rather than the smoke job's 3.11 and 3.13: 3.14 is where the conda
  # route may reach a Python pip cannot resolve at all.
  intel-macos-routes:
    name: Intel macOS routes (py${{ matrix.python }})
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up micromamba with Python ${{ matrix.python }}
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pip-only
          create-args: python=${{ matrix.python }} pip
          init-shell: bash
          cache-environment: false

      # ---- step 1: the default route, expected to fail -------------------------
      - name: pip install, no conda base
        id: pip_only
        continue-on-error: true
        shell: bash -el {0}
        run: python -m pip install ".[trees]"

      - name: Assert the default route still fails
        shell: bash -el {0}
        run: |
          if [ '${{ steps.pip_only.outcome }}' = 'failure' ]; then
            echo "pip install failed, as platform-support.toml records for this platform."
          else
            echo "::error::pip install SUCCEEDED on Intel macOS, but the record expects it to fail. numba or llvmlite may have resumed publishing macOS x86_64 wheels — update platform-support.toml and the README, which currently say this platform needs a conda base."
            exit 1
          fi

      # ---- step 2: the documented exception, expected to work -------------------
      # A second environment, built from nothing: what is verified must be what the
      # documentation instructs, not a repaired version of the failed attempt above.
      - name: Create a second environment with a conda-provided base
        shell: bash -el {0}
        run: |
          micromamba create -y -n conda-base -c conda-forge \
            python=${{ matrix.python }} pip numba llvmlite jax jaxlib
          micromamba run -n conda-base python -m pip --version

      - name: pip install on top of the conda base
        id: conda_base
        continue-on-error: true
        shell: bash -el {0}
        run: micromamba run -n conda-base python -m pip install ".[trees]"

      - name: Assert the documented route works
        shell: bash -el {0}
        run: |
          if [ '${{ steps.conda_base.outcome }}' = 'success' ]; then
            echo "Installed on top of the conda base, as documented."
          else
            echo "::error::The documented Intel macOS route failed. This platform has no working installation route — record the failing package and revise the README, which currently offers this one."
            exit 1
          fi

      # Whether conda's packages survived pip is the mechanism the whole route
      # depends on, so the versions actually present are printed rather than assumed.
      - name: Report the versions actually installed
        shell: bash -el {0}
        run: |
          micromamba run -n conda-base python -m pip list
          micromamba run -n conda-base python -c "
          from importlib.metadata import version
          for p in ('numba','llvmlite','jax','jaxlib','cellrank','numpy','anndata'):
              print(f'{p:10} {version(p)}')
          "

      - name: Import the package
        env:
          MPLBACKEND: agg
        shell: bash -el {0}
        run: |
          micromamba run -n conda-base python -c "
          import atlas, atlas.pp, atlas.tl, atlas.pl
          print('atlas', getattr(atlas, '__version__', 'unknown'))
          "

  # ── Does the code behave on a non-Linux OS? ───────────────────────────────────
  # An explicit include list, not an os axis crossed with test.yaml's generated
  # environments: those are JSON objects, and a GitHub `exclude:` against an
  # object-valued key must restate the whole object — which silently stops matching
  # the moment the hatch matrix changes.
  #
  # Both platforms run both boundary Pythons. 3.11 is the only version in the older
  # dependency world (cellrank 2.0.7); 3.14 represents the current one. The
  # pre-release environment stays Linux-only, as it is in test.yaml today.
  test-non-linux:
    name: ${{ matrix.env }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, env: hatch-test.py3.11-stable, python: "3.11" }
          - { name: macOS arm64, os: macos-latest, env: hatch-test.py3.14-stable, python: "3.14" }
          - { name: Windows x86_64, os: windows-latest, env: hatch-test.py3.11-stable, python: "3.11" }
          - { name: Windows x86_64, os: windows-latest, env: hatch-test.py3.14-stable, python: "3.14" }
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: create hatch environment
        run: uvx hatch env create ${{ matrix.env }}
      - name: list all installed package versions
        run: uvx hatch run ${{ matrix.env }}:uv pip list
      # The same command test.yaml runs on Linux, so a difference in outcome is a
      # difference in platform rather than in invocation. On Windows `-n auto` puts
      # pytest-xdist over spawn-based loky, which is the likeliest source of a red
      # run that is not ATLAS's fault; characterise such a failure before treating
      # it as a platform verdict.
      - name: run tests using hatch
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        run: uvx hatch run ${{ matrix.env }}:run-cov -v --color=yes -n auto

  # ── Does ATLAS behave against conda-forge's binaries? ─────────────────────────
  # Scheduled runs only. This is the one place ATLAS runs against conda-forge's builds
  # of numba, llvmlite and jaxlib rather than PyPI's wheels — and since the README now
  # sends Intel macOS users down that route, an import is thin evidence that it works.
  #
  # It is deliberately NOT in the merge path. hatch cannot drive this environment
  # (`hatch env create` installs with uv/pip, which is what fails on this platform), so
  # the invocation is bespoke: a red run here would leave the question of whether the
  # platform or the invocation broke. Keeping it on the cron means that question is
  # asked twice a month rather than on every pull request.
  #
  # macOS arm64 already covers every OS behaviour Intel Macs share — paths, encoding,
  # process spawning are Darwin properties. What this adds is the binary provenance.
  intel-macos-tests:
    name: Test suite on the conda route (Intel macOS, py${{ matrix.python }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Set up micromamba with the conda base
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: atlas
          create-args: >-
            python=${{ matrix.python }} pip
            numba llvmlite jax jaxlib
          init-shell: bash
          cache-environment: false
      # The same four packages the README instructs, then the project and the test
      # dependencies from PyPI. `dependency-groups` is not installable by pip, so the
      # test tools are named here; keep them in step with pyproject's `test` group.
      - name: Install ATLAS and the test dependencies
        shell: bash -el {0}
        run: |
          python -m pip install ".[trees]"
          python -m pip install "coverage>=7.10" pytest pytest-cov pytest-xdist
      - name: Report the versions actually installed
        shell: bash -el {0}
        run: |
          python -c "
          from importlib.metadata import version
          for p in ('numba','llvmlite','jax','jaxlib','cellrank','numpy','anndata'):
              print(f'{p:10} {version(p)}')
          "
      - name: Run the test suite
        env:
          MPLBACKEND: agg
        shell: bash -el {0}
        run: pytest -v --color=yes -n auto

  # Single required status check for branch protection, mirroring test.yaml's own
  # `check` job. That job cannot cover jobs in another workflow, so this workflow
  # needs its own — and the repository setting has to be added by hand.
  check:
    name: Platform verification passes
    if: always()
    needs:
      - resolution
      - smoke
      - smoke-conda
      - intel-macos-routes
      - test-non-linux
      # intel-macos-tests is deliberately absent: it runs on the schedule only, so on
      # a pull request it is skipped, and alls-green treats a skipped need as a
      # failure. Its result is read from the scheduled run, not from the merge gate.
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
