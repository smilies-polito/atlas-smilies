name: Release

on:
  release:
    types: [published]

# Use "trusted publishing", see https://docs.pypi.org/trusted-publishers/
jobs:
  release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atlas-smilies
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build package
        run: uv build
      - name: Check the metadata of everything built
        run: uvx twine check --strict dist/*

      - name: Install the built wheel and import the package
        env:
          MPLBACKEND: agg
        run: |
          python -m venv .release-check
          . .release-check/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip list
          python -c "import atlas, atlas.pp, atlas.tl, atlas.pl; print('imported atlas', getattr(atlas, '__version__', 'unknown'))"

      - name: Refuse a version nobody chose
        run: python scripts/check_release_version.py

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
